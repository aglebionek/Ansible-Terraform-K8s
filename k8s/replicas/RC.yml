apiVersion: v1
kind: ReplicationController
metadata:
  name: myapp-rc
  labels:
    app: myapp
    type: frontend
spec:
  template:
    # This is basically a pod specification, but it is nested inside the replication controller spec
    metadata:
      name: myapp-pod
      labels:
        type: frontend
    spec:
      containers:
        - name: nginx-container
          image: nginx
  replicas: 3

