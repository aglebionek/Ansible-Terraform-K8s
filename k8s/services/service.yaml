apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: NodePort
  ports:
    - port: 80 # Port from the point of view of the service (its own port)
      targetPort: 80 # Port from the point of view of the service (the target's port)
      nodePort: 30008 # This is the port for external access
  selector:
    pod: pod-selector-label

---

apiVersion: v1
kind: Service
metadata:
  name: my-service-2
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    pod: pod-selector-label
