# You can remove this config from file after creating the secret, as it contains sensitive information. 
# You can also setup correct permissions for the file/secret object modification/access.
apiVersion: v1
kind: Secret
metadata:
  name: example-secret
type: Opaque
# base64 encoded values, can use `echo -n 'value' | base64` to encode 
data:
  username: YWRtaW4=
  password: YWRtaW5wYXNzd29yZA==

---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    envFrom:
    - secretRef:
        name: example-secret
    # OR
    env:
    - name: SECRET_USERNAME
      valueFrom:
        secretKeyRef:
          name: example-secret
          key: username
    - name: SECRET_PASSWORD 
      valueFrom:
        secretKeyRef:
          name: example-secret
          key: password
    # OR
    volumes:
    - name: secret-volume
      secret:
        secretName: example-secret
  