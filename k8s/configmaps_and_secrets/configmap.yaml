# Config map with nested key-value pairs
apiVersion: v1
kind: ConfigMap
metadata:
  name: player-config
data:
  # Key-value pairs for player configuration
  player_lives: "5"
  properties_file_name: "ui.properties"

  # Nested key-value pairs
  base.properties: |
    enemy.types=zombie,alien,robot
    player.max_lives=10
  ui.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true

  # The configMap can be anything, for example an nginx.conf file. 
  # We could then mount this configMap as a volume and use it as the nginx configuration file.
  # Example mounting of this configMap as a volume:
  # volumes:
  # - name: nginx-config-volume # define the name of the created volume
  #   configMap:
  #     name: nginx-config # specify the name of the configMap to use as the source of the volume
  # volumeMounts:
  # - name: nginx-config-volume # specify the name of the volume to mount
  #   mountPath: /etc/nginx # specify the path inside the container where the volume should be mounted
  nginx.conf: |
    events {
      worker_connections  1024;
    }
    http {
      server {
        listen 80;
        location / {
          root /usr/share/nginx/html;
          index index.html index.htm;
        }
      }
    }
    ...

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    envFrom:
    - configMapRef:
        name: player-config
    # OR
    env:
    - name: PLAYER_LIVES
      valueFrom:
        configMapKeyRef:
          name: player-config
          key: player_lives
    # OR
    volumes:
    - name: nginx-config-volume
      configMap:
        name: player-config